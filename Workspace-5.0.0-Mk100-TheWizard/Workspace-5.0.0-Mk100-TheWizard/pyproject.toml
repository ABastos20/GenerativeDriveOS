[tool.poetry]
name = "jarvis"
version = "0.1.0"
description = "Self-hosted, multi-agent RAG assistant - JARVIS System"
authors = ["Ariel <ariel@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "jarvis", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
typer = {extras = ["all"], version = "^0.12.0"}
structlog = "^24.1.0"
qdrant-client = "1.15.1"
click = "8.1.7"
psycopg2-binary = "^2.9.9"
redis = "^5.0.0"
sentence-transformers = "^5.1.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
email-validator = "^2.0.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
httpx = "^0.27.0"
pypandoc = "^1.13"
PyPDF2 = "^3.0.1"
python-multipart = "^0.0.9"
aiofiles = "^24.1.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
watchdog = "^6.0.0"
# HIGH-PERFORMANCE: Acceleration libraries for Ryzen 7 9800X3D
uvloop = "^0.21.0"          # 2-4x faster asyncio event loop
orjson = "^3.10.0"          # 5-10x faster JSON serialization
msgspec = "^0.19.0"         # Fast validation and serialization
multiprocess = "^0.70.0"    # Better multiprocessing support
opentelemetry-api = "^1.39.0"
opentelemetry-sdk = "^1.39.0"
opentelemetry-exporter-otlp = "^1.39.0"
opentelemetry-instrumentation-fastapi = "^0.60b0"
opentelemetry-instrumentation-sqlalchemy = "^0.60b0"
opentelemetry-instrumentation-httpx = "^0.60b0"
opentelemetry-exporter-prometheus = "^0.60b0"
networkx = "^3.6"
python-louvain = "^0.16"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
black = "^24.8.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
ipython = "^8.29.0"
pytest-xdist = "^3.8.0"

[tool.poetry.scripts]
jarvis = "jarvis.cli.main:app"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=jarvis --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require Docker services)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
