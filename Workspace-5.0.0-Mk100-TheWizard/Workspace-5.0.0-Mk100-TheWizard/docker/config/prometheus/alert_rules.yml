groups:
  - name: jarvis_alerts
    rules:
      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_server_duration_milliseconds_bucket[5m])) > 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High API Latency (instance {{ $labels.instance }})"
          description: "95th percentile latency is > 500ms (current value: {{ $value }}ms)\n  LABELS = {{ $labels }}"

      - alert: APIErrorRateHigh
        expr: rate(http_requests_total{status="500"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate (instance {{ $labels.instance }})"
          description: "API is returning 500 errors\n  LABELS = {{ $labels }}"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance Down (instance {{ $labels.instance }})"
          description: "Prometheus target missing for more than 1 minute."
