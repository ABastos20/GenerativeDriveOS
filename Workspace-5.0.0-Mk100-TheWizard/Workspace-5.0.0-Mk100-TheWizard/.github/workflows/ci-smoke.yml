name: CI Smoke (Docs Guard + Migrations + Health)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: jarvis
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U jarvis" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run docs guard
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          bash scripts/validate_docs_change.sh FETCH_HEAD HEAD

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mcp.txt
          python -m pip install alembic psycopg[binary]

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U jarvis && break || sleep 1
          done

      - name: Create pgcrypto extension
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: jarvis
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python - <<'PY'
            import os
            from psycopg import connect
            conn = connect(host=os.environ['POSTGRES_HOST'], user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD'], dbname=os.environ['POSTGRES_DB'])
            with conn:
                with conn.cursor() as cur:
                    cur.execute("CREATE EXTENSION IF NOT EXISTS pgcrypto;")
                    print('pgcrypto ensured')
          PY

      - name: Run Alembic migrations
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: jarvis
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          alembic upgrade head

      - name: Start MCP server (background) and health-check
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: jarvis
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          nohup python -m uvicorn src.jarvis.mcp_server:app --host 127.0.0.1 --port 8001 > mcp.log 2>&1 &
          for i in {1..20}; do
            curl -sS http://127.0.0.1:8001/mcp/health | grep pgcrypto && break || sleep 1
          done
          cat mcp.log
