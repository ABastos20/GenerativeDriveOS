# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories:
  - "Current project: JARVIS System - a modular AI assistant and advisor"
  - "Project uses PowerShell for orchestration and initialization"
  - "Integration config located at .bmad/integrations.yaml"
  - "System integrates multiple APIs and local LLMs"
  - "User (Ariel) prefers bilingual communication: English and Portuguese (Portugal)"
  - "Focus on extensible, modular agent architecture"
  - "Documentation output to docs/ folder"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
