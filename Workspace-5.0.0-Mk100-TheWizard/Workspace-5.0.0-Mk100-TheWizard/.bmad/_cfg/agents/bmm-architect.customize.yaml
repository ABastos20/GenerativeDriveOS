# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories:
  - "JARVIS System architecture: Modular agentic design"
  - "Core components: Orchestrator, API integrations, LLM modules"
  - "Integration points: OpenAI API, local LLMs (llama.cpp), custom REST endpoints"
  - "Configuration management via YAML files"
  - "PowerShell orchestration layer for service management"
  - "Security focus: Credential management and secure API handling"
  - "Extensibility priority: Easy addition of new APIs and LLMs"
  - "Documentation standards: Clear setup, activation, and usage guides"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
